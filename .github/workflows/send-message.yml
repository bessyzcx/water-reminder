name: Water Reminder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1-3,5,7,9 * * 1-5'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send reminder
        run: python send.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
